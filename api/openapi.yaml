openapi: 3.1.0
info:
  title: Click & Collect API
  version: 0.1.0
  summary: Backend for the MegaLoja Online Click & Collect MVP.
  description: |
    REST API for creating orders with either standard delivery or
    pickup-in-store, listing stores, transitioning order status, and
    retrieving order notifications.

    All non-health endpoints are versioned under `/api/v1`.
  contact:
    name: click-and-collect
    url: https://github.com/gab-mello/click-and-collect

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
    description: Liveness/readiness probes.
  - name: stores
    description: Pickup stores. Read-only — managed via SQL migrations / seeds.
  - name: products
    description: Product catalog. Read-only — managed via SQL migrations / seeds.
  - name: carts
    description: |
      Persistent shopping carts. A cart starts as `ACTIVE`, accumulates items,
      and is converted into an order via the checkout endpoint, after which it
      becomes `CHECKED_OUT` and immutable.
  - name: orders
    description: Customer orders and their lifecycle.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness probe (unversioned)
      description: Returns `{"status":"ok"}` when the process is up. Mirrors `/api/v1/health`.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: Returns `{"status":"ok"}` when the process is up.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/stores:
    get:
      tags: [stores]
      operationId: list-stores
      summary: List all stores
      description: Returns every store known to the system, including inactive ones.
      responses:
        "200":
          description: Stores list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoresListResponse" }
              examples:
                seed:
                  summary: Seeded stores
                  value:
                    stores:
                      - id: store-sp-paulista
                        name: MegaLoja Paulista
                        address: "Av. Paulista, 1000"
                        city: São Paulo
                        state: SP
                        zip: 01310-100
                        capacity: 50
                        active: true
                      - id: store-rj-copacabana
                        name: MegaLoja Copacabana
                        address: "Av. Atlântica, 500"
                        city: Rio de Janeiro
                        state: RJ
                        zip: 22010-000
                        capacity: 30
                        active: true
                      - id: store-mg-savassi
                        name: MegaLoja Savassi
                        address: "R. Pernambuco, 200"
                        city: Belo Horizonte
                        state: MG
                        zip: 30130-150
                        capacity: 20
                        active: false

  /api/v1/stores/{id}:
    get:
      tags: [stores]
      operationId: get-store
      summary: Get a store by ID
      parameters:
        - $ref: "#/components/parameters/StoreID"
      responses:
        "200":
          description: Store found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
              examples:
                paulista:
                  value:
                    id: store-sp-paulista
                    name: MegaLoja Paulista
                    address: "Av. Paulista, 1000"
                    city: São Paulo
                    state: SP
                    zip: 01310-100
                    capacity: 50
                    active: true
        "404":
          description: Store not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found:
                  value: { error: "store not found", code: "store_not_found" }

  /api/v1/products:
    get:
      tags: [products]
      operationId: list-products
      summary: List all products
      description: Returns every product known to the system, including inactive ones.
      responses:
        "200":
          description: Products list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductsListResponse" }

  /api/v1/products/{id}:
    get:
      tags: [products]
      operationId: get-product
      summary: Get a product by ID
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Product not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found:
                  value: { error: "product not found", code: "product_not_found" }

  /api/v1/carts:
    post:
      tags: [carts]
      operationId: create-cart
      summary: Create a new active cart
      description: |
        Creates a new anonymous cart. **No request body is required** — the
        cart represents an empty shopping basket. Customer identity
        (`customer_name`, `customer_email`) is collected later, at checkout
        time, and is stored on the resulting order rather than the cart.

        The client (typically the frontend) should persist the returned
        `id` — e.g. in `localStorage` — and use it for all subsequent
        cart calls until checkout.
      responses:
        "201":
          description: Cart created. Status is always `ACTIVE` and `items` is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /api/v1/carts/{id}:
    get:
      tags: [carts]
      operationId: get-cart
      summary: Get a cart by ID (items hydrated)
      parameters:
        - $ref: "#/components/parameters/CartID"
      responses:
        "200":
          description: Cart found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404":
          description: Cart not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found:
                  value: { error: "cart not found", code: "cart_not_found" }

  /api/v1/carts/{id}/items:
    post:
      tags: [carts]
      operationId: add-cart-item
      summary: Add (or increase quantity of) an item in the cart
      description: |
        Upserts the `(cart_id, product_id)` pair. If the item already exists,
        `quantity` is **added** to the current value. Returns the hydrated cart.

        The cart must be `ACTIVE`. The product must exist and be `active`.
      parameters:
        - $ref: "#/components/parameters/CartID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemRequest" }
            examples:
              add_two:
                value: { product_id: prod-headphones, quantity: 2 }
      responses:
        "200":
          description: Item upserted. Cart returned with hydrated items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: |
            Validation error.

            - `invalid_body`
            - `invalid_quantity` — `quantity` must be greater than zero.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Cart or product not found. The `code` distinguishes:

            - `cart_not_found`
            - `product_not_found`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            Business rule violation.

            - `cart_not_active` — cart has already been checked out.
            - `product_inactive` — product exists but is not for sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/carts/{id}/items/{product_id}:
    patch:
      tags: [carts]
      operationId: update-cart-item-quantity
      summary: Set the quantity of an existing cart item
      description: Overwrites the quantity (does not add to it). The cart must be `ACTIVE` and the line must exist.
      parameters:
        - $ref: "#/components/parameters/CartID"
        - $ref: "#/components/parameters/CartItemProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCartItemRequest" }
            examples:
              set_to_two:
                value: { quantity: 2 }
      responses:
        "200":
          description: Item updated. Cart returned with hydrated items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: |
            - `invalid_body`
            - `invalid_quantity`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            - `cart_not_found`
            - `cart_item_not_found`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            - `cart_not_active`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [carts]
      operationId: remove-cart-item
      summary: Remove a line from the cart
      parameters:
        - $ref: "#/components/parameters/CartID"
        - $ref: "#/components/parameters/CartItemProductID"
      responses:
        "200":
          description: Item removed. Cart returned with the remaining items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404":
          description: |
            - `cart_not_found`
            - `cart_item_not_found`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            - `cart_not_active`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/carts/{id}/checkout:
    post:
      tags: [carts]
      operationId: checkout-cart
      summary: Convert an active cart into an order
      description: |
        Transactional cart checkout — the canonical way to create an order
        with items.

        Steps performed inside a single transaction:

        1. Lock the cart row.
        2. Verify the cart is `ACTIVE` and has at least one item.
        3. Re-read every product; reject inactive ones.
        4. Snapshot product `name` and `unit_price_cents` into `order_items` —
           future product price/name changes will not retroactively affect
           past orders.
        5. Compute `total_amount_cents` server-side.
        6. Apply the same delivery-method / pickup-store validation as
           `POST /api/v1/orders` (pickup orders require an active store and
           get a 6-digit `pickup_code`).
        7. Mark the cart `CHECKED_OUT`.

        Any failure rolls back; the cart remains `ACTIVE` and no partial
        order is persisted.
      parameters:
        - $ref: "#/components/parameters/CartID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
            examples:
              standard:
                summary: Standard delivery
                value:
                  customer_name: Grace Hopper
                  customer_email: grace@example.com
                  delivery_method: standard
              pickup:
                summary: Pickup in store
                value:
                  customer_name: Grace Hopper
                  customer_email: grace@example.com
                  delivery_method: pickup_in_store
                  pickup_store_id: store-sp-paulista
      responses:
        "201":
          description: Cart was checked out. Returns the created order (and a notification slot for symmetry with other endpoints — always null on checkout because the order starts in `AWAITING_PREPARATION`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400":
          description: |
            Validation error.

            - `invalid_body`
            - `customer_name_required`
            - `customer_email_required`
            - `invalid_delivery_method`
            - `pickup_store_required`
            - `pickup_store_not_allowed`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            - `cart_not_found`
            - `store_not_found`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            Business rule violation.

            - `cart_not_active`
            - `cart_empty`
            - `product_inactive`
            - `store_inactive`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orders:
    post:
      tags: [orders]
      operationId: create-order
      summary: Create a new order
      description: |
        Creates a new order **without items**. This is the legacy entry point;
        the canonical path is `POST /api/v1/carts/{id}/checkout`, which produces
        an order with `items` and a computed `total_amount_cents`.

        Orders created here will have `items: []` and `total_amount_cents: 0`.

        The body shape depends on `delivery_method`:

        - `standard` — `pickup_store_id` MUST be omitted.
        - `pickup_in_store` — `pickup_store_id` is required and must reference
          an active store. The server generates a 6-digit `pickup_code`.

        Newly-created orders always start in status `AWAITING_PREPARATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
            examples:
              standard:
                summary: Standard delivery
                value:
                  customer_name: Ada Lovelace
                  customer_email: ada@example.com
                  delivery_method: standard
              pickup:
                summary: Pickup in store
                value:
                  customer_name: Grace Hopper
                  customer_email: grace@example.com
                  delivery_method: pickup_in_store
                  pickup_store_id: store-sp-paulista
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              examples:
                pickup:
                  value:
                    id: 9f1c2a4b8d6e7012
                    customer_name: Grace Hopper
                    customer_email: grace@example.com
                    delivery_method: pickup_in_store
                    pickup_store_id: store-sp-paulista
                    pickup_code: "428193"
                    status: AWAITING_PREPARATION
                    cart_id: null
                    total_amount_cents: 0
                    items: []
                    created_at: 2026-06-14T18:30:00Z
                    updated_at: 2026-06-14T18:30:00Z
        "400":
          description: |
            Validation error. The `code` field disambiguates which rule failed:

            - `invalid_body` — JSON could not be decoded.
            - `customer_name_required`
            - `customer_email_required`
            - `invalid_delivery_method`
            - `pickup_store_required` — `pickup_in_store` without a store ID.
            - `pickup_store_not_allowed` — `standard` with a store ID set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                missing_name:
                  value: { error: "customer name is required", code: "customer_name_required" }
                pickup_store_required:
                  value: { error: "pickup store is required for pickup_in_store orders", code: "pickup_store_required" }
        "404":
          description: Pickup store not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found:
                  value: { error: "store not found", code: "store_not_found" }
        "409":
          description: Pickup store exists but is not accepting pickups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                inactive:
                  value: { error: "selected store is not accepting pickups", code: "store_inactive" }

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      operationId: get-order
      summary: Get an order by ID
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: Order not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found:
                  value: { error: "order not found", code: "order_not_found" }

  /api/v1/orders/{id}/status:
    patch:
      tags: [orders]
      operationId: update-order-status
      summary: Update an order's status
      description: |
        Transitions the order to a new status. Allowed transitions:

        - `AWAITING_PREPARATION` → `READY_FOR_PICKUP` or `CANCELLED`
        - `READY_FOR_PICKUP` → `COLLECTED` or `CANCELLED`

        When a `pickup_in_store` order moves to `READY_FOR_PICKUP`, a
        notification is created and returned in the `notification` field.
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStatusRequest" }
            examples:
              ready:
                value: { status: READY_FOR_PICKUP }
              collected:
                value: { status: COLLECTED }
              cancelled:
                value: { status: CANCELLED }
      responses:
        "200":
          description: Order updated. `notification` is present only when the transition produced one (pickup-in-store going to `READY_FOR_PICKUP`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatusResponse" }
              examples:
                ready_with_notification:
                  value:
                    order:
                      id: 9f1c2a4b8d6e7012
                      customer_name: Grace Hopper
                      customer_email: grace@example.com
                      delivery_method: pickup_in_store
                      pickup_store_id: store-sp-paulista
                      pickup_code: "428193"
                      status: READY_FOR_PICKUP
                      cart_id: null
                      total_amount_cents: 0
                      items: []
                      created_at: 2026-06-14T18:30:00Z
                      updated_at: 2026-06-14T19:05:12Z
                    notification:
                      id: 0a1b2c3d4e5f6071
                      order_id: 9f1c2a4b8d6e7012
                      message: "Order 9f1c2a4b8d6e7012 is ready for pickup. Use code 428193."
                      created_at: 2026-06-14T19:05:12Z
        "400":
          description: |
            Validation error.

            - `invalid_body` — JSON could not be decoded.
            - `invalid_status` — value is not one of the four `Status` constants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid_status:
                  value: { error: "invalid status", code: "invalid_status" }
        "404":
          description: Order not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found:
                  value: { error: "order not found", code: "order_not_found" }
        "409":
          description: The requested transition is not allowed from the current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid_transition:
                  value: { error: "invalid status transition", code: "invalid_transition" }

  /api/v1/orders/{id}/notifications:
    get:
      tags: [orders]
      operationId: list-order-notifications
      summary: List notifications for an order
      description: Returns every notification produced for the order, oldest first. The order must exist.
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Notifications list (may be empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsResponse" }
              examples:
                one:
                  value:
                    notifications:
                      - id: 0a1b2c3d4e5f6071
                        order_id: 9f1c2a4b8d6e7012
                        message: "Order 9f1c2a4b8d6e7012 is ready for pickup. Use code 428193."
                        created_at: 2026-06-14T19:05:12Z
        "404":
          description: Order not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found:
                  value: { error: "order not found", code: "order_not_found" }

components:
  parameters:
    StoreID:
      name: id
      in: path
      required: true
      description: Store identifier (slug, e.g. `store-sp-paulista`).
      schema:
        type: string
        examples: [store-sp-paulista]
    OrderID:
      name: id
      in: path
      required: true
      description: Order identifier (16 lowercase hex chars).
      schema:
        type: string
        pattern: "^[0-9a-f]{16}$"
        examples: [9f1c2a4b8d6e7012]
    ProductID:
      name: id
      in: path
      required: true
      description: Product identifier (slug, e.g. `prod-headphones`).
      schema:
        type: string
        examples: [prod-headphones]
    CartID:
      name: id
      in: path
      required: true
      description: Cart identifier (16 lowercase hex chars).
      schema:
        type: string
        pattern: "^[0-9a-f]{16}$"
        examples: [bc3458adb995135f]
    CartItemProductID:
      name: product_id
      in: path
      required: true
      description: Product identifier of the cart line to act on.
      schema:
        type: string
        examples: [prod-headphones]

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]

    Store:
      type: object
      required: [id, name, address, city, state, zip, capacity, active]
      properties:
        id:        { type: string,  examples: [store-sp-paulista] }
        name:      { type: string,  examples: [MegaLoja Paulista] }
        address:   { type: string,  examples: ["Av. Paulista, 1000"] }
        city:      { type: string,  examples: [São Paulo] }
        state:     { type: string,  examples: [SP] }
        zip:       { type: string,  examples: [01310-100] }
        capacity:  { type: integer, examples: [50] }
        active:    { type: boolean, examples: [true] }

    StoresListResponse:
      type: object
      required: [stores]
      properties:
        stores:
          type: array
          items: { $ref: "#/components/schemas/Store" }

    Product:
      type: object
      required: [id, name, description, price_cents, image_url, active, created_at, updated_at]
      properties:
        id:          { type: string,  examples: [prod-headphones] }
        name:        { type: string,  examples: [Wireless Headphones X1] }
        description: { type: string,  examples: ["Bluetooth 5.3 with active noise cancel"] }
        price_cents:
          type: integer
          format: int64
          minimum: 0
          description: Price in the smallest currency unit (BRL cents). Frontend formats as needed.
          examples: [59900]
        image_url:
          type: string
          description: |
            Path to the product image. The backend only stores the path —
            it does not upload, host, or serve image binaries. The frontend
            is expected to provide the file at this path (e.g.
            `frontend/public/products/headphones.jpg`).
          examples: ["/products/headphones.jpg"]
        active:      { type: boolean, examples: [true] }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    ProductsListResponse:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    CartStatus:
      type: string
      enum: [ACTIVE, CHECKED_OUT]
      description: |
        - `ACTIVE` — items may be added, updated, or removed; the cart can be checked out.
        - `CHECKED_OUT` — the cart was converted into an order and is now immutable.

    CartItem:
      type: object
      required: [id, cart_id, product_id, quantity, created_at, updated_at]
      properties:
        id:         { type: string, pattern: "^[0-9a-f]{16}$" }
        cart_id:    { type: string, pattern: "^[0-9a-f]{16}$" }
        product_id: { type: string, examples: [prod-headphones] }
        quantity:   { type: integer, minimum: 1, examples: [2] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Cart:
      type: object
      required: [id, status, items, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{16}$"
          examples: [bc3458adb995135f]
        status:
          $ref: "#/components/schemas/CartStatus"
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AddCartItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string, examples: [prod-headphones] }
        quantity:   { type: integer, minimum: 1, examples: [2] }

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, examples: [2] }

    CheckoutRequest:
      type: object
      required: [customer_name, customer_email, delivery_method]
      properties:
        customer_name:  { type: string, examples: [Grace Hopper] }
        customer_email: { type: string, format: email, examples: [grace@example.com] }
        delivery_method:
          $ref: "#/components/schemas/DeliveryMethod"
        pickup_store_id:
          type: string
          description: Required when `delivery_method` is `pickup_in_store`; must be omitted otherwise.
          examples: [store-sp-paulista]

    CheckoutResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        notification:
          $ref: "#/components/schemas/Notification"
          description: |
            Reserved for symmetry with other endpoints. Always omitted on
            checkout because new orders start in `AWAITING_PREPARATION` and
            notifications are only emitted on the transition to
            `READY_FOR_PICKUP`.

    DeliveryMethod:
      type: string
      enum: [standard, pickup_in_store]
      description: |
        - `standard` — shipping; no store involvement.
        - `pickup_in_store` — customer picks up at `pickup_store_id`; server issues a `pickup_code`.

    Status:
      type: string
      enum: [AWAITING_PREPARATION, READY_FOR_PICKUP, COLLECTED, CANCELLED]
      description: Order lifecycle state. See `update-order-status` for allowed transitions.

    Order:
      type: object
      required:
        - id
        - customer_name
        - customer_email
        - delivery_method
        - status
        - total_amount_cents
        - items
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{16}$"
          examples: [9f1c2a4b8d6e7012]
        customer_name:
          type: string
          examples: [Grace Hopper]
        customer_email:
          type: string
          format: email
          examples: [grace@example.com]
        delivery_method:
          $ref: "#/components/schemas/DeliveryMethod"
        pickup_store_id:
          type: [string, "null"]
          description: Set only when `delivery_method` is `pickup_in_store`.
          examples: [store-sp-paulista]
        pickup_code:
          type: [string, "null"]
          description: 6-digit code issued by the server for pickup-in-store orders.
          pattern: "^[0-9]{6}$"
          examples: ["428193"]
        status:
          $ref: "#/components/schemas/Status"
        cart_id:
          type: [string, "null"]
          description: |
            Set when the order was created via `POST /api/v1/carts/{id}/checkout`.
            Null for orders created through the legacy `POST /api/v1/orders` path.
          pattern: "^[0-9a-f]{16}$"
          examples: [bc3458adb995135f]
        total_amount_cents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Server-computed total over `items`. Always `0` for legacy orders
            created via `POST /api/v1/orders` (which have no items).
          examples: [129700]
        items:
          type: array
          description: |
            Snapshots of the products at checkout time. Empty array `[]` for
            legacy orders. Each item carries the product name and unit price
            captured at the moment the order was created, so historical orders
            are unaffected by later product changes.
          items: { $ref: "#/components/schemas/OrderItem" }
        created_at:
          type: string
          format: date-time
          examples: [2026-06-14T18:30:00Z]
        updated_at:
          type: string
          format: date-time
          examples: [2026-06-14T18:30:00Z]

    OrderItem:
      type: object
      required: [id, order_id, product_id, product_name, unit_price_cents, quantity, total_price_cents]
      properties:
        id:                 { type: string, pattern: "^[0-9a-f]{16}$" }
        order_id:           { type: string, pattern: "^[0-9a-f]{16}$" }
        product_id:         { type: string, examples: [prod-headphones] }
        product_name:       { type: string, examples: [Wireless Headphones X1] }
        unit_price_cents:
          type: integer
          format: int64
          minimum: 0
          examples: [59900]
        quantity:           { type: integer, minimum: 1, examples: [2] }
        total_price_cents:
          type: integer
          format: int64
          minimum: 0
          description: "Equals `unit_price_cents * quantity`."
          examples: [119800]

    CreateOrderRequest:
      type: object
      required: [customer_name, customer_email, delivery_method]
      properties:
        customer_name:
          type: string
          examples: [Grace Hopper]
        customer_email:
          type: string
          format: email
          examples: [grace@example.com]
        delivery_method:
          $ref: "#/components/schemas/DeliveryMethod"
        pickup_store_id:
          type: string
          description: Required when `delivery_method` is `pickup_in_store`; must be omitted otherwise.
          examples: [store-sp-paulista]

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/Status"

    Notification:
      type: object
      required: [id, order_id, message, created_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{16}$"
          examples: [0a1b2c3d4e5f6071]
        order_id:
          type: string
          pattern: "^[0-9a-f]{16}$"
          examples: [9f1c2a4b8d6e7012]
        message:
          type: string
          examples: ["Order 9f1c2a4b8d6e7012 is ready for pickup. Use code 428193."]
        created_at:
          type: string
          format: date-time
          examples: [2026-06-14T19:05:12Z]

    UpdateStatusResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        notification:
          $ref: "#/components/schemas/Notification"
          description: Present only when the transition produced a notification.

    NotificationsResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }

    Error:
      type: object
      required: [error]
      description: Error envelope used by every non-2xx response.
      properties:
        error:
          type: string
          description: Human-readable message.
          examples: ["order not found"]
        code:
          type: string
          description: Stable machine-readable code; safe to switch on.
          examples: [order_not_found]
